<!--
  HEADER — COMPACT  (use for transactional emails: confirmations, password
  reset, meeting-request notifications, etc.). Slim teal bar, no big headline —
  keeps transactional mail appropriately quiet but still on-brand.
  Optional placeholder: {{ kicker }} (small label, e.g. "Tilmelding bekræftet"); omit if not needed.
-->
<tr>
  <td bgcolor="#14798A" class="px" style="background:#14798A; padding:18px 40px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td style="font-family:Arial,Helvetica,sans-serif; font-size:18px; font-weight:bold; color:#FFFFFF; letter-spacing:-0.3px;">CBC <span style="color:#5BAE3A;">&bull;</span> Event</td>
        <td align="right" style="font-family:Arial,Helvetica,sans-serif; font-size:12px; font-weight:bold; letter-spacing:1.5px; color:#CFE7EB;">{{ kicker }}</td>
      </tr>
    </table>
  </td>
</tr>
