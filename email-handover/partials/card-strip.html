<!--
  CARD STRIP — optional 3-up highlight band (chip + label + one short line).
  Use sparingly, only on announcement emails where it adds a hook (e.g. the
  invitation). Stacks on mobile via the .stack class. Keep sublines ~2 words so
  they stay on one line across clients. Chip colours: teal #14798A, green #5BAE3A.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td class="stack" width="32%" valign="top" bgcolor="#E2F0F2" style="background:#E2F0F2; border:1px solid #E5E9E5; padding:14px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr><td width="22" height="22" bgcolor="#14798A" style="background:#14798A; border-radius:6px; font-size:0; line-height:0;">&nbsp;</td></tr></table>
      <div style="font-family:Arial,Helvetica,sans-serif; font-size:15px; font-weight:bold; color:#16201F; padding-top:10px;">{{ card1_title }}</div>
      <div style="font-family:Arial,Helvetica,sans-serif; font-size:12px; line-height:16px; color:#69736F; padding-top:3px;">{{ card1_sub }}</div>
    </td>
    <td class="stack-gap" width="2%" style="font-size:0; line-height:0;">&nbsp;</td>
    <td class="stack" width="32%" valign="top" bgcolor="#E9F4E3" style="background:#E9F4E3; border:1px solid #E5E9E5; padding:14px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr><td width="22" height="22" bgcolor="#5BAE3A" style="background:#5BAE3A; border-radius:6px; font-size:0; line-height:0;">&nbsp;</td></tr></table>
      <div style="font-family:Arial,Helvetica,sans-serif; font-size:15px; font-weight:bold; color:#16201F; padding-top:10px;">{{ card2_title }}</div>
      <div style="font-family:Arial,Helvetica,sans-serif; font-size:12px; line-height:16px; color:#69736F; padding-top:3px;">{{ card2_sub }}</div>
    </td>
    <td class="stack-gap" width="2%" style="font-size:0; line-height:0;">&nbsp;</td>
    <td class="stack" width="32%" valign="top" bgcolor="#F7F8F6" style="background:#F7F8F6; border:1px solid #E5E9E5; padding:14px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr><td width="22" height="22" bgcolor="#5BAE3A" style="background:#5BAE3A; border-radius:6px; font-size:0; line-height:0;">&nbsp;</td><td width="6" style="font-size:0; line-height:0;">&nbsp;</td><td width="22" height="22" bgcolor="#14798A" style="background:#14798A; border-radius:6px; font-size:0; line-height:0;">&nbsp;</td></tr></table>
      <div style="font-family:Arial,Helvetica,sans-serif; font-size:15px; font-weight:bold; color:#16201F; padding-top:10px;">{{ card3_title }}</div>
      <div style="font-family:Arial,Helvetica,sans-serif; font-size:12px; line-height:16px; color:#69736F; padding-top:3px;">{{ card3_sub }}</div>
    </td>
  </tr>
</table>
