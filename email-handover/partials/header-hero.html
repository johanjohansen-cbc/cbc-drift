<!--
  HEADER — HERO  (use for announcement / marketing emails: invitation,
  save-the-date, reminder, program update). Teal block, big headline.
  Placeholders: {{ eyebrow }} {{ headline }} {{ headline_accent }} {{ date_main }} {{ date_year }} {{ location }}
  For purely transactional mail (confirmations, password reset, notifications)
  use header-compact.html instead — the big hero is too much there.
-->
<tr>
  <td bgcolor="#14798A" class="px" style="background:#14798A; padding:36px 40px 40px 40px;">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
      <tr><td style="font-family:Arial,Helvetica,sans-serif; font-size:18px; font-weight:bold; color:#FFFFFF; letter-spacing:-0.3px;">CBC <span style="color:#5BAE3A;">&bull;</span> Event</td></tr>
    </table>
    <div style="font-family:Arial,Helvetica,sans-serif; font-size:12px; font-weight:bold; letter-spacing:2px; color:#CFE7EB; padding:26px 0 8px 0;">{{ eyebrow }}</div>
    <h1 class="h1" style="margin:0; font-family:Arial,Helvetica,sans-serif; font-size:46px; line-height:50px; font-weight:bold; color:#FFFFFF; letter-spacing:-1px;">{{ headline }} <span style="color:#5BAE3A;">{{ headline_accent }}</span></h1>
    <div style="font-family:Georgia,'Times New Roman',serif; font-style:italic; font-size:22px; color:#E9F4E3; padding-top:14px;">{{ date_main }} <span style="font-family:Arial,Helvetica,sans-serif; font-style:normal; color:#FFFFFF;">{{ date_year }}</span></div>
    <div style="font-family:Arial,Helvetica,sans-serif; font-size:14px; color:#CFE7EB; padding-top:14px;">{{ location }}</div>
  </td>
</tr>
